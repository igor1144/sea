name: Сборка TWRP (Android 14.0)

on:
  workflow_dispatch: # Запуск вручную кнопкой из интерфейса

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Подготовка окружения Ubuntu
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libsdl1.1-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
        
    - name: Установка официальной утилиты Repo
      run: |
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Настройка Git (без этого repo выдаст ошибку)
      run: |
        git config --global user.name "Builder"
        git config --global user.email "builder@twrp.me"

    - name: Инициализация и синхронизация минимального манифеста TWRP 14
      run: |
        mkdir twrp
        cd twrp
        # Важно: используем проверенную официальную ветку Omni для Android 14
        repo init -u https://github.com -b twrp-14.0 --depth=1
        
        # Синхронизируем только самое необходимое, обрубая историю коммитов (--depth=1)
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Клонирование вашего дерева устройства (Device Tree)
      run: |
        # Здесь вы будете скачивать ваше готовое на 90% дерево
        # Замените путь на структуру вашего процессора/бренда
        git clone https://github.com -b android-14 twrp/device/xiaomi/ваша_модель
