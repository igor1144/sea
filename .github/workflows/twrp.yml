name: Сборка TWRP (Android 14.0)

on:
  workflow_dispatch: # Запуск вручную кнопкой в интерфейсе GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 1. Скачиваем сам репозиторий с вашим sea.zip в корень
    - name: Клонирование текущего репозитория
      uses: actions/checkout@v4

    # 2. Ставим чистый и стабильный набор пакетов
    - name: Подготовка окружения Ubuntu
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev unzip python3

    # 3. Настраиваем Git (без этого repo init падает)
    - name: Конфигурация Git
      run: |
        git config --global user.name "Builder"
        git config --global user.email "builder@twrp.me"

    # 4. Устанавливаем Repo проверенным способом через пакетный менеджер Ubuntu
    # Это исключает curl и ошибку «exit code 6»
    - name: Установка Repo из репозитория
      run: |
        sudo apt-get update
        sudo apt-get install -y repo

    # 5. Инициализация манифеста и синхронизация исходников
    - name: Синхронизация манифеста TWRP 14
      run: |
        mkdir -p twrp
        cd twrp
        repo init -u https://github.com -b twrp-14.0 --depth=1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    # 6. Распаковка вашего Device Tree
    - name: Распаковка Device Tree из встроенного sea.zip
      run: |
        # ВНИМАНИЕ: Замените 'ваша_модель' на кодовое имя вашего устройства!
        TARGET_DIR="twrp/device/xiaomi/sea"
        mkdir -p $TARGET_DIR
        
        # Распаковываем во временную папку
        mkdir -p /tmp/sea_extract
        unzip -q "$GITHUB_WORKSPACE/sea.zip" -d /tmp/sea_extract
        
        # Вытаскиваем внутренности папки (как для модуля magisk) строго в корень TARGET_DIR
        mv /tmp/sea_extract/*/* $TARGET_DIR/
        rm -rf /tmp/sea_extract
        
        echo "=== Структура папки дерева устройства ==="
        ls -la $TARGET_DIR

    # 7. Компиляция образа
    - name: Запуск компиляции vendor_boot
      run: |
        cd twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        
        # ВНИМАНИЕ: Измените 'ваша_модель' на имя вашего устройства (например: lunch twrp_chopin-eng)
        lunch twrp_sea-eng
        mka vendorbootimage

    # 8. Сохранение результата
    - name: Загрузка готового образа в артефакты GitHub
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Vendor-BootImage
        path: twrp/out/target/product/ваша_модель/vendor_boot.img
