name: Сборка TWRP (Android 14.0)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Клонирование текущего репозитория
      uses: actions/checkout@v4

    - name: Подготовка окружения Ubuntu
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev unzip python3

    - name: Конфигурация Git
      run: |
        git config --global user.name "Builder"
        git config --global user.email "builder@twrp.me"

    # Скачиваем скрипт напрямую с GitHub, где лежит чистый Python-код без HTML-заглушек
    - name: Установка свежего Google Repo
      run: |
        mkdir -p ~/bin
        curl -sL https://githubusercontent.com > ~/bin/repo
        chmod a+x ~/bin/repo

    # ВАЖНО: вызываем утилиту строго через python3 ~/bin/repo, чтобы она правильно распарсила URL манифеста
    - name: Синхронизация манифеста TWRP 14
      run: |
        mkdir -p twrp
        cd twrp
        python3 ~/bin/repo init -u https://github.com -b twrp-14.0 --depth=1
        python3 ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Распаковка Device Tree из встроенного sea.zip
      run: |
        # Замените 'ваша_модель' на кодовое имя вашего устройства!
        TARGET_DIR="twrp/device/xiaomi/sea"
        mkdir -p $TARGET_DIR
        
        mkdir -p /tmp/sea_extract
        unzip -q "$GITHUB_WORKSPACE/sea.zip" -d /tmp/sea_extract
        
        mv /tmp/sea_extract/*/* $TARGET_DIR/
        rm -rf /tmp/sea_extract
        
        echo "=== Структура папки дерева устройства ==="
        ls -la $TARGET_DIR

    - name: Запуск компиляции vendor_boot
      run: |
        cd twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        
        # Замените 'ваша_модель' на имя вашего устройства!
        lunch twrp_sea-eng
        mka vendorbootimage

    - name: Загрузка готового образа в артефакты GitHub
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Vendor-BootImage
        path: twrp/out/target/product/ваша_модель/vendor_boot.img
